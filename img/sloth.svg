<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="Photo triage: rules, then model, nothing deleted">
  <rect width="480" height="200" fill="#10151c"/>
  <g font-family="monospace" font-size="12" text-anchor="middle">
    <rect x="20" y="70" width="80" height="60" rx="8" fill="#161b22" stroke="#7ee0b5"/><text x="60" y="105" fill="#e6edf3">photos</text>
    <rect x="150" y="36" width="120" height="48" rx="8" fill="#161b22" stroke="#f0c674"/><text x="210" y="64" fill="#e6edf3">rules: junk</text>
    <rect x="150" y="116" width="120" height="48" rx="8" fill="#161b22" stroke="#7aa7ff"/><text x="210" y="144" fill="#e6edf3">model: review</text>
    <rect x="320" y="36" width="140" height="48" rx="8" fill="#161b22" stroke="#262d38"/><text x="390" y="64" fill="#8b96a5">moved, never deleted</text>
    <rect x="320" y="116" width="140" height="48" rx="8" fill="#7ee0b5"/><text x="390" y="144" fill="#04130d" font-weight="700">journal + undo</text>
  </g>
  <g stroke="#8b96a5" stroke-width="1.5" fill="none"><path d="M100 100 H125 V60 H150M100 100 H125 V140 H150M270 60 H320M270 140 H320"/></g>
</svg>
